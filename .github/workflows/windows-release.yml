name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Windows Release
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.YIRA_RELEASES_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Build and publish GitHub release assets
        run: npm run release:win

  linux:
    name: Linux Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.YIRA_RELEASES_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Validate Linux packaging policy
        run: node scripts/linux-packaging.test.mjs

      - name: Build and publish GitHub release assets
        run: npm run release:linux

  publish:
    name: Publish Release
    runs-on: ubuntu-22.04
    needs: [windows, linux]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.YIRA_RELEASES_TOKEN }}
      # First entry is the primary repository. yira-releases only receives copies
      # so installs from 0.1.82 or older can update to a build that uses yira.
      RELEASE_REPOSITORIES: SaGgaSsa/yira SaGgaSsa/yira-releases
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate release notes
        run: node scripts/generate-release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md

      - name: Upload legal documents and publish as latest
        shell: bash
        run: |
          for repository in ${RELEASE_REPOSITORIES}; do
            gh release upload "${GITHUB_REF_NAME}" docs/legal/PRIVACY.md docs/legal/TERMS.md --clobber --repo "${repository}"

            release_id="$(
              gh api "repos/${repository}/releases" --paginate \
                --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id" \
                | head -n 1
            )"

            if [ -z "$release_id" ]; then
              echo "Release for ${GITHUB_REF_NAME} not found in ${repository}"
              exit 1
            fi

            gh api --method PATCH "repos/${repository}/releases/${release_id}" \
              -F draft=false \
              -F prerelease=false \
              -F make_latest=true \
              -F body=@release-notes.md
          done
